<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Silvério Multimarcas — Controle de Estoque</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;font-size:16px;background:#f4f4f4;color:#1a1a1a}
:root{
  --brand:#c0392b;--brand-dark:#96281b;--brand-light:#fdf2f2;--brand-border:#f5c6c6;
  --white:#fff;--gray-50:#f9f9f9;--gray-100:#f0f0f0;--gray-200:#e0e0e0;
  --gray-400:#aaa;--gray-600:#666;--gray-800:#333;
  --green:#1a7a34;--amber:#b8860b;--border:#e0e0e0;
  --shadow:0 1px 4px rgba(0,0,0,.08);--radius:10px;--radius-lg:14px;
  --sidebar-w:230px;--topbar-h:60px;--touch:44px;
}
/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--brand-dark) 0%,var(--brand) 100%);padding:16px}
.login-box{background:#fff;border-radius:var(--radius-lg);padding:40px 36px;width:100%;max-width:380px;box-shadow:0 8px 40px rgba(0,0,0,.25)}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo img{height:60px;object-fit:contain}
.login-title{font-size:18px;font-weight:700;color:var(--gray-800);text-align:center;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--gray-400);text-align:center;margin-bottom:28px}
/* APP */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);background:var(--brand);display:flex;flex-direction:column;flex-shrink:0;box-shadow:2px 0 8px rgba(0,0,0,.18);z-index:50;transition:transform .25s ease}
.sidebar-logo{padding:14px 18px 12px;border-bottom:1px solid rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;gap:5px}
.sidebar-logo img{height:58px;object-fit:contain;filter:brightness(0) invert(1)}
.logo-sub{font-size:10px;color:rgba(255,255,255,.55);text-align:center}
.nav{padding:10px 8px;flex:1;overflow-y:auto}
.nav-sec{padding:8px 12px 4px;font-size:9px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.nav-btn{display:flex;align-items:center;gap:10px;padding:0 12px;height:var(--touch);min-height:var(--touch);border-radius:8px;cursor:pointer;color:rgba(255,255,255,.75);margin-bottom:2px;font-size:13px;border:none;background:none;width:100%;text-align:left;transition:background .15s,color .15s;touch-action:manipulation}
.nav-btn:hover{background:rgba(255,255,255,.15);color:#fff}
.nav-btn.active{background:#fff;color:var(--brand);font-weight:600}
.nav-icon{font-size:16px;width:22px;text-align:center;flex-shrink:0}
.nav-badge{margin-left:auto;background:#fff;color:var(--brand);border-radius:9999px;font-size:10px;padding:1px 7px;font-weight:700}
.nav-btn.active .nav-badge{background:var(--brand);color:#fff}
.sidebar-footer{padding:12px 10px;border-top:1px solid rgba(255,255,255,.15);font-size:10px;color:rgba(255,255,255,.45);text-align:center;line-height:1.6}
.sidebar-footer button{background:none;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.6);border-radius:6px;padding:4px 10px;font-size:10px;cursor:pointer;margin-top:6px;display:block;width:100%}
.sidebar-footer button:hover{background:rgba(255,255,255,.1)}
.ham{display:none;align-items:center;justify-content:center;width:var(--touch);height:var(--touch);border:none;background:transparent;cursor:pointer;flex-shrink:0}
.ham span{display:block;width:20px;height:2px;background:var(--gray-800);margin:4px auto;border-radius:2px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:49}
.sidebar-overlay.open{display:block}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:var(--topbar-h);min-height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);gap:8px;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:10px;min-width:0}
.topbar-title{font-size:clamp(14px,2.5vw,17px);font-weight:700;color:var(--gray-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-user{font-size:12px;color:var(--gray-400);white-space:nowrap}
.content{flex:1;overflow-y:auto;padding:clamp(12px,3vw,24px);background:#f4f4f4}
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--border);border-left:3px solid var(--brand);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat-label{font-size:10px;color:var(--gray-600);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.stat-value{font-size:clamp(15px,2.2vw,21px);font-weight:700;color:var(--gray-800)}
.stat-sub{font-size:10px;color:var(--gray-400);margin-top:3px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden}
.card-inner{padding:16px 18px}
.card-title{font-size:10px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--gray-100);flex-wrap:wrap;gap:8px}
.card-header-title{font-size:13px;font-weight:600;color:var(--gray-800)}
.dash-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.dash-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);text-align:center}
.dash-icon{font-size:22px;margin-bottom:5px}
.dash-label{font-size:10px;color:var(--gray-600);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.dash-value{font-size:clamp(13px,2vw,19px);font-weight:700;color:var(--gray-800)}
.dash-sub{font-size:10px;color:var(--gray-400);margin-top:3px}
.dash-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-label{font-size:12px;color:var(--gray-800);min-width:110px;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;background:var(--gray-100);border-radius:4px;height:7px}
.bar-fill{height:7px;border-radius:4px;transition:width .4s}
.bar-val{font-size:11px;color:var(--gray-600);min-width:60px;text-align:right}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:480px}
th{text-align:left;padding:8px 12px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-600);border-bottom:2px solid var(--gray-100);font-weight:700;background:var(--gray-50);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--gray-100);font-size:13px;color:var(--gray-800);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fdf7f7}
.total-row td{background:var(--brand-light);font-weight:700;color:var(--brand-dark);border-top:2px solid var(--brand-border);border-bottom:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;height:var(--touch);min-height:var(--touch);border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;transition:background .15s,transform .1s;touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-dark)}
.btn-success{background:var(--green);color:#fff}
.btn-ghost{background:transparent;color:var(--gray-600);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--gray-800)}
.btn-sm{height:34px;min-height:34px;padding:0 12px;font-size:12px}
.btn-del{height:30px;min-height:30px;padding:0 10px;font-size:12px;background:transparent;color:var(--brand);border:1px solid var(--brand-border);border-radius:6px;cursor:pointer;touch-action:manipulation;transition:background .15s}
.btn-del:hover{background:var(--brand-light)}
.badge{display:inline-block;padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:600}
.badge-ok{background:#e6f7ec;color:#1a7a34}
.badge-low{background:#fff8e1;color:var(--amber)}
.badge-out{background:var(--brand-light);color:var(--brand)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;background:var(--brand-light);color:var(--brand);border:1px solid var(--brand-border);font-weight:500}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{margin-bottom:13px}
.form-group.full{grid-column:1/-1}
.form-label{display:block;font-size:12px;color:var(--gray-600);margin-bottom:5px;font-weight:500}
input,select{width:100%;background:var(--gray-50);border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--gray-800);font-size:16px;outline:none;transition:border .15s,background .15s;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:var(--brand);background:#fff}
.hint{font-size:11px;color:var(--gray-400);margin-top:4px}
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;line-height:1.5}
.alert-warn{background:#fff8e1;border:1px solid #ffd54f;color:#7a5c00}
.alert-err{background:var(--brand-light);border:1px solid var(--brand-border);color:var(--brand-dark)}
.alert-info{background:#e8f4fd;border:1px solid #b3d7f0;color:#1a5276}
.alert-success{background:#e6f7ec;border:1px solid #a8d5b5;color:#155724}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:300;padding:16px}
.modal{background:#fff;border-radius:var(--radius-lg);padding:24px 22px 28px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.modal-handle{width:40px;height:4px;background:var(--gray-200);border-radius:2px;margin:0 auto 16px;display:none}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:16px;font-weight:700;color:var(--gray-800)}
.x-btn{background:none;border:none;color:var(--gray-400);cursor:pointer;font-size:24px;line-height:1;padding:4px;touch-action:manipulation}
.x-btn:hover{color:var(--brand)}
.filter-bar{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;box-shadow:var(--shadow)}
.fg{display:flex;flex-direction:column;gap:4px}
.fg-label{font-size:10px;font-weight:700;color:var(--gray-600);text-transform:uppercase;letter-spacing:.05em}
.fg input,.fg select{padding:7px 10px;font-size:14px;border-radius:7px;width:auto;min-width:120px;height:36px}
.filter-actions{display:flex;gap:8px;align-self:flex-end}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--brand-light);border:1px solid var(--brand-border);color:var(--brand);border-radius:9999px;padding:3px 10px;font-size:12px;font-weight:500;margin-right:6px;margin-bottom:8px}
.chip button{background:none;border:none;cursor:pointer;color:var(--brand);font-size:16px;line-height:1;padding:0 0 0 2px}
.result-info{font-size:12px;color:var(--gray-400);display:inline-block;margin-bottom:8px}
.cargo-wrap{position:relative}
.cargo-input{width:100%;background:var(--gray-50);border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:16px;outline:none;transition:border .15s}
.cargo-input:focus{border-color:var(--brand);background:#fff}
.cargo-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:100;max-height:200px;overflow-y:auto}
.cargo-option{padding:10px 14px;cursor:pointer;font-size:14px;color:var(--gray-800);border-bottom:1px solid var(--gray-100)}
.cargo-option:last-child{border-bottom:none}
.cargo-option:hover,.cargo-option.sel{background:var(--brand-light);color:var(--brand)}
.cargo-option mark{background:none;color:var(--brand);font-weight:700}
.cargo-empty{padding:10px 14px;font-size:13px;color:var(--gray-400)}
.cargo-grid{display:flex;flex-wrap:wrap;gap:10px}
.cargo-pill{display:flex;align-items:center;gap:8px;background:var(--brand-light);border:1px solid var(--brand-border);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:500;color:var(--brand-dark)}
.cargo-pill button{background:none;border:none;cursor:pointer;color:var(--brand);font-size:18px;line-height:1;padding:0;opacity:.65}
.func-card{border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;margin-bottom:9px;cursor:pointer;transition:border .15s}
.func-card:hover{border-color:var(--brand-border)}
.func-card.expanded{border-color:var(--brand);box-shadow:0 2px 8px rgba(192,57,43,.1)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}
.val-custo{color:var(--gray-600)}
.val-venda{color:var(--brand);font-weight:600}
.val-green{color:var(--green);font-weight:600}
.preview-box{background:var(--brand-light);border:1px solid var(--brand-border);border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:13px}
.preview-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--brand-border)}
.preview-row:last-child{border-bottom:none}
.empty{padding:40px;text-align:center;color:var(--gray-400);font-size:13px}
.loading{padding:40px;text-align:center;color:var(--gray-400);font-size:13px}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--gray-200);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:1024px){
  :root{--sidebar-w:200px}
  .stat-row,.dash-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dash-2{grid-template-columns:1fr}
}
@media(max-width:480px){
  :root{--sidebar-w:100%}
  .sidebar{position:fixed;top:0;left:0;height:100vh;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .ham{display:flex}
  .stat-row,.dash-grid{grid-template-columns:1fr 1fr}
  .dash-2{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .filter-bar{flex-direction:column}
  .fg input,.fg select{min-width:100%;width:100%}
  .card-header{flex-direction:column;align-items:flex-start}
  .topbar{padding:0 10px}
  .content{padding:10px}
  .modal-bg{align-items:flex-end;padding:0}
  .modal{border-radius:var(--radius-lg) var(--radius-lg) 0 0;max-width:100%;padding:20px 16px 28px}
  .modal-handle{display:block}
}
@media(min-width:1400px){
  :root{--sidebar-w:250px}
  .stat-row,.dash-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .dash-2{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useEffect,useRef,useCallback}=React;
const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const mesAtual=new Date().getMonth();
const anoAtual=new Date().getFullYear();
const mesKey=()=>`${anoAtual}-${String(mesAtual+1).padStart(2,'0')}`;
const CATS=['Funilaria','Pintura','Acessórios','Limpeza','Elétrica','Mecânica','Outros'];
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmt=n=>Number(n||0).toLocaleString('pt-BR');
const hoje=new Date().toISOString().split('T')[0];
const primeiroDiaMes=`${anoAtual}-${String(mesAtual+1).padStart(2,'0')}-01`;
const LOGO='https://www.silveriomultimarcas.com.br/imgs/logo.png';

// Supabase
const SUPA_URL='https://cguryvwebhatbrrgsjjn.supabase.co';
const SUPA_KEY='sb_publishable_Lyqn_jsXXhbcPtK4cREuWQ_7jKzwMAy';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

// Log de ação
async function registrarLog(usuario,acao,detalhes){
  try{
    await sb.from('log_acoes').insert({
      usuario_id:usuario.id,
      usuario_nome:usuario.nome,
      acao,
      detalhes
    });
  }catch(e){}
}

function initials(n){return(n||'?').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();}

function stockStatus(p){
  if(p.estoque===0)return{cls:'badge-out',txt:'Sem estoque'};
  if(p.estoque<=p.estoque_minimo)return{cls:'badge-low',txt:'Estoque baixo'};
  return{cls:'badge-ok',txt:'OK'};
}

// ── LOGIN ────────────────────────────────────────────────────
function Login({onLogin}){
  const[email,setEmail]=useState('');
  const[senha,setSenha]=useState('');
  const[err,setErr]=useState('');
  const[loading,setLoading]=useState(false);

  const entrar=async()=>{
    if(!email.trim()||!senha.trim()){setErr('Preencha email e senha.');return;}
    setLoading(true);setErr('');
    const{data,error}=await sb.from('usuarios')
      .select('*').eq('email',email.trim().toLowerCase()).eq('senha',senha).eq('ativo',true).single();
    if(error||!data){setErr('Email ou senha incorretos.');setLoading(false);return;}
    localStorage.setItem('prepcarros_user',JSON.stringify(data));
    onLogin(data);
    setLoading(false);
  };

  return(
    <div className="login-wrap">
      <div className="login-box">
        <div className="login-logo">
          <img src={LOGO} alt="Silvério" onError={e=>{e.target.style.display='none';}}/>
        </div>
        <div className="login-title">Controle de Estoque</div>
        <div className="login-sub">Silvério Multimarcas</div>
        {err&&<div className="alert alert-err">{err}</div>}
        <div className="form-group">
          <label className="form-label">Email</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="seu@email.com" onKeyDown={e=>e.key==='Enter'&&entrar()}/>
        </div>
        <div className="form-group">
          <label className="form-label">Senha</label>
          <input type="password" value={senha} onChange={e=>setSenha(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==='Enter'&&entrar()}/>
        </div>
        <button className="btn btn-primary" style={{width:'100%',marginTop:8}} onClick={entrar} disabled={loading}>
          {loading&&<span className="spinner"/>}{loading?'Entrando...':'Entrar'}
        </button>
      </div>
    </div>
  );
}

// ── MODAL ────────────────────────────────────────────────────
function Modal({title,onClose,children}){
  useEffect(()=>{document.body.style.overflow='hidden';return()=>{document.body.style.overflow='';};},[]);
  return(
    <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-handle"/>
        <div className="modal-header">
          <span className="modal-title">{title}</span>
          <button className="x-btn" onClick={onClose}>×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

// ── CARGO BUSCÁVEL ────────────────────────────────────────────
function CargoBuscavel({cargos,value,onChange}){
  const[busca,setBusca]=useState(value||'');
  const[open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{setBusca(value||'');},[value]);
  useEffect(()=>{
    const f=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',f);return()=>document.removeEventListener('mousedown',f);
  },[]);
  const lista=useMemo(()=>busca?cargos.filter(c=>c.toLowerCase().includes(busca.toLowerCase())):cargos,[cargos,busca]);
  const sel=c=>{onChange(c);setBusca(c);setOpen(false);};
  return(
    <div className="cargo-wrap" ref={ref}>
      <input className="cargo-input" value={busca} placeholder="Digite para buscar..." onChange={e=>{setBusca(e.target.value);onChange('');setOpen(true);}} onFocus={()=>setOpen(true)} autoComplete="off"/>
      {open&&<div className="cargo-dropdown">
        {lista.length===0?<div className="cargo-empty">Nenhum cargo encontrado.</div>
          :lista.map(c=><div key={c} className={`cargo-option${value===c?' sel':''}`} onMouseDown={()=>sel(c)}>{c}</div>)}
      </div>}
    </div>
  );
}

// ── FILTER BAR ────────────────────────────────────────────────
function FilterBar({funcionarios,filFunc,setFilFunc,dataIni,setDataIni,dataFim,setDataFim,onFiltrar,onLimpar,ativo,count}){
  return(<>
    <div className="filter-bar">
      {funcionarios&&<div className="fg"><span className="fg-label">👷 Funcionário</span>
        <select value={filFunc||''} onChange={e=>setFilFunc&&setFilFunc(e.target.value)}>
          <option value="">Todos</option>{funcionarios.map(f=><option key={f.id} value={f.id}>{f.nome}</option>)}
        </select>
      </div>}
      <div className="fg"><span className="fg-label">📅 De</span><input type="date" value={dataIni} onChange={e=>setDataIni(e.target.value)}/></div>
      <div className="fg"><span className="fg-label">📅 Até</span><input type="date" value={dataFim} onChange={e=>setDataFim(e.target.value)}/></div>
      <div className="filter-actions">
        <button className="btn btn-primary btn-sm" onClick={onFiltrar}>🔍 Filtrar</button>
        {ativo&&<button className="btn btn-ghost btn-sm" onClick={onLimpar}>Limpar</button>}
      </div>
    </div>
    {ativo&&<div style={{marginBottom:8}}>
      {funcionarios&&filFunc&&funcionarios.find(f=>f.id===filFunc)&&<span className="chip">👷 {funcionarios.find(f=>f.id===filFunc).nome}<button onClick={()=>setFilFunc('')}>×</button></span>}
      <span className="chip">📅 {dataIni} → {dataFim}<button onClick={()=>{setDataIni(primeiroDiaMes);setDataFim(hoje);}}>×</button></span>
      <span className="result-info">{count} registro{count!==1?'s':''}</span>
    </div>}
  </>);
}

// ── DASHBOARD ─────────────────────────────────────────────────
function PgDashboard({dados}){
  const{produtos,entradas,consumos,funcionarios}=dados;
  const cM=consumos.filter(c=>c.data>=primeiroDiaMes&&c.data<=hoje);
  const eM=entradas.filter(e=>e.data>=primeiroDiaMes&&e.data<=hoje);
  const totV=cM.reduce((s,c)=>s+(c.venda*c.qtd),0);
  const totC=cM.reduce((s,c)=>s+(c.custo*c.qtd),0);
  const inv=eM.reduce((s,e)=>s+(e.custo||0)*e.qtd_consumo,0);
  const criticos=produtos.filter(p=>p.estoque<=p.estoque_minimo);
  const pp={};cM.forEach(c=>{if(!pp[c.produto_nome])pp[c.produto_nome]={nome:c.produto_nome,v:0};pp[c.produto_nome].v+=(c.venda*c.qtd);});
  const topP=Object.values(pp).sort((a,b)=>b.v-a.v).slice(0,6);const maxP=topP[0]?.v||1;
  const pF=funcionarios.map(f=>({...f,v:cM.filter(c=>c.funcionario_id===f.id).reduce((s,c)=>s+(c.venda*c.qtd),0)})).filter(f=>f.v>0).sort((a,b)=>b.v-a.v);
  const maxF=pF[0]?.v||1;
  return(<div>
    <div style={{fontSize:12,color:'var(--gray-400)',marginBottom:12}}>Resumo de <strong style={{color:'var(--gray-800)'}}>{MESES[mesAtual]} {anoAtual}</strong></div>
    <div className="dash-grid">
      <div className="dash-card"><div className="dash-icon">💰</div><div className="dash-label">Valor de venda</div><div className="dash-value" style={{color:'var(--brand)'}}>{brl(totV)}</div><div className="dash-sub">a cobrar nos carros</div></div>
      <div className="dash-card"><div className="dash-icon">📦</div><div className="dash-label">Custo dos produtos</div><div className="dash-value">{brl(totC)}</div><div className="dash-sub">total utilizado</div></div>
      <div className="dash-card"><div className="dash-icon">📥</div><div className="dash-label">Investido em estoque</div><div className="dash-value">{brl(inv)}</div><div className="dash-sub">{eM.length} entrada{eM.length!==1?'s':''}</div></div>
      <div className="dash-card"><div className="dash-icon">⚠️</div><div className="dash-label">Estoque crítico</div><div className="dash-value" style={{color:criticos.length>0?'var(--amber)':'var(--green)'}}>{criticos.length}</div><div className="dash-sub">{criticos.length>0?'itens para repor':'tudo em dia'}</div></div>
    </div>
    <div className="dash-2">
      <div className="card card-inner"><div className="card-title">Produtos mais consumidos</div>
        {topP.length===0?<div style={{color:'var(--gray-400)',fontSize:13}}>Sem lançamentos ainda.</div>:topP.map(p=><div key={p.nome} className="bar-row"><span className="bar-label" title={p.nome}>{p.nome}</span><div className="bar-track"><div className="bar-fill" style={{width:`${(p.v/maxP)*100}%`,background:'var(--brand)'}}/></div><span className="bar-val">{brl(p.v)}</span></div>)}
      </div>
      <div className="card card-inner"><div className="card-title">Consumo por funcionário</div>
        {pF.length===0?<div style={{color:'var(--gray-400)',fontSize:13}}>Sem lançamentos ainda.</div>:pF.map(f=><div key={f.id} className="bar-row"><span className="bar-label" title={f.nome}>{f.nome}</span><div className="bar-track"><div className="bar-fill" style={{width:`${(f.v/maxF)*100}%`,background:'#2980b9'}}/></div><span className="bar-val">{brl(f.v)}</span></div>)}
      </div>
    </div>
    {criticos.length>0&&<div className="card card-inner"><div className="card-title" style={{color:'var(--amber)'}}>⚠️ Itens com estoque crítico</div>
      <div className="tbl-wrap"><table><thead><tr><th>Produto</th><th>Categoria</th><th>Atual</th><th>Mínimo</th><th>Status</th></tr></thead>
      <tbody>{criticos.map(p=>{const s=stockStatus(p);return(<tr key={p.id}><td style={{fontWeight:600}}>{p.nome}</td><td><span className="tag">{p.categoria}</span></td><td style={{fontWeight:700,color:p.estoque===0?'var(--brand)':'var(--amber)'}}>{p.estoque}</td><td style={{color:'var(--gray-400)'}}>{p.estoque_minimo}</td><td><span className={`badge ${s.cls}`}>{s.txt}</span></td></tr>);})}</tbody>
      </table></div>
    </div>}
  </div>);
}

// ── ESTOQUE ───────────────────────────────────────────────────
function PgEstoque({dados,usuario,onRefresh,setPage,setEntradaProdId}){
  const{produtos}=dados;
  const[busca,setBusca]=useState('');
  const[modal,setModal]=useState(false);
  const[form,setForm]=useState({nome:'',categoria:'Funilaria',unidade_compra:'L',unidade_consumo:'L',fator:'1',estoque:'',estoque_minimo:'',custo:'',venda:''});
  const[err,setErr]=useState('');
  const[loading,setLoading]=useState(false);
  const lista=useMemo(()=>produtos.filter(p=>p.nome.toLowerCase().includes(busca.toLowerCase())||p.categoria.toLowerCase().includes(busca.toLowerCase())),[produtos,busca]);
  const criticos=produtos.filter(p=>p.estoque<=p.estoque_minimo).length;

  const salvar=async()=>{
    if(!form.nome.trim()){setErr('Informe o nome.');return;}
    if(produtos.some(p=>p.nome.trim().toLowerCase()===form.nome.trim().toLowerCase())){setErr(`Já existe "${form.nome.trim()}".`);return;}
    if(!form.custo||isNaN(form.custo)){setErr('Informe o custo.');return;}
    if(!form.venda||isNaN(form.venda)){setErr('Informe o valor de venda.');return;}
    if(parseFloat(form.venda)<parseFloat(form.custo)){setErr('Valor de venda menor que o custo.');return;}
    setLoading(true);setErr('');
    const fator=parseFloat(form.fator)||1;
    const estoqueInicial=Math.round((parseInt(form.estoque)||0)*fator);
    const minimoConvertido=Math.round((parseInt(form.estoque_minimo)||0)*fator);
    const{error}=await sb.from('produtos').insert({
      nome:form.nome.trim(),categoria:form.categoria,
      unidade_compra:form.unidade_compra,unidade_consumo:form.unidade_consumo||form.unidade_compra,
      fator,estoque:estoqueInicial,estoque_minimo:minimoConvertido,
      custo:parseFloat(form.custo),venda:parseFloat(form.venda)
    });
    if(error){setErr('Erro ao salvar: '+error.message);setLoading(false);return;}
    await registrarLog(usuario,'Produto cadastrado',form.nome.trim());
    setModal(false);setForm({nome:'',categoria:'Funilaria',unidade_compra:'L',unidade_consumo:'L',fator:'1',estoque:'',estoque_minimo:'',custo:'',venda:''});
    onRefresh();setLoading(false);
  };

  const remover=async(id,nome)=>{
    const temEntrada=dados.entradas.some(e=>e.produto_id===id);
    const temConsumo=dados.consumos.some(c=>c.produto_id===id);
    if(temEntrada||temConsumo){alert(`Não é possível remover "${nome}".\nPossui histórico registrado.`);return;}
    if(!window.confirm(`Remover "${nome}"?`))return;
    await sb.from('produtos').delete().eq('id',id);
    await registrarLog(usuario,'Produto removido',nome);
    onRefresh();
  };

  return(<div>
    <div className="stat-row">
      <div className="stat"><div className="stat-label">Total de produtos</div><div className="stat-value">{produtos.length}</div></div>
      <div className="stat"><div className="stat-label">Crítico / zerado</div><div className="stat-value" style={{color:criticos>0?'var(--brand)':'var(--green)'}}>{criticos}</div></div>
      <div className="stat"><div className="stat-label">Valor estoque (custo)</div><div className="stat-value" style={{fontSize:'clamp(12px,2vw,17px)'}}>{brl(produtos.reduce((s,p)=>s+p.custo*p.estoque,0))}</div></div>
      <div className="stat"><div className="stat-label">Valor estoque (venda)</div><div className="stat-value" style={{fontSize:'clamp(12px,2vw,17px)',color:'var(--brand)'}}>{brl(produtos.reduce((s,p)=>s+p.venda*p.estoque,0))}</div></div>
    </div>
    {criticos>0&&<div className="alert alert-warn" style={{marginBottom:12}}>
      <div style={{fontWeight:600,marginBottom:6}}>⚠️ {criticos} produto{criticos>1?'s':''} com estoque baixo ou zerado:</div>
      <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
        {produtos.filter(p=>p.estoque<=p.estoque_minimo).map(p=>(
          <button key={p.id} onClick={()=>{setEntradaProdId(p.id);setPage('entradas');}}
            style={{background:'#fff',border:'1px solid #e6b800',borderRadius:7,padding:'5px 12px',cursor:'pointer',fontSize:12,fontWeight:600,color:'#7a5c00',display:'flex',alignItems:'center',gap:6}}>
            <span style={{background:p.estoque===0?'#c0392b':'#e6b800',color:'#fff',borderRadius:'9999px',fontSize:10,padding:'1px 6px',fontWeight:700}}>{p.estoque===0?'ZERADO':p.estoque}</span>
            {p.nome}<span style={{color:'#b8860b'}}>→ Registrar entrada</span>
          </button>
        ))}
      </div>
    </div>}
    <div className="card">
      <div className="card-header">
        <input style={{background:'var(--gray-50)',border:'1.5px solid var(--border)',borderRadius:'8px',padding:'7px 12px',fontSize:'14px',outline:'none',width:'210px'}} placeholder="🔍  Buscar produto..." value={busca} onChange={e=>setBusca(e.target.value)}/>
        <button className="btn btn-primary btn-sm" onClick={()=>setModal(true)}>+ Produto</button>
      </div>
      {lista.length===0?<div className="empty">Nenhum produto encontrado.</div>:
      <div className="tbl-wrap"><table>
        <thead><tr><th>Produto</th><th>Cat.</th><th>Custo</th><th>Venda</th><th>Margem</th><th>Estoque</th><th>Status</th><th></th></tr></thead>
        <tbody>{lista.map(p=>{const s=stockStatus(p);const mg=p.venda>0?Math.round(((p.venda-p.custo)/p.venda)*100):0;return(<tr key={p.id}>
          <td style={{fontWeight:600}}>{p.nome}<br/><span style={{color:'var(--gray-400)',fontWeight:400,fontSize:10}}>compra: {p.unidade_compra}{p.fator&&p.fator!==1?` · consumo: ${p.unidade_consumo} (1${p.unidade_compra}=${p.fator}${p.unidade_consumo})`:''}</span></td>
          <td><span className="tag">{p.categoria}</span></td>
          <td className="val-custo">{brl(p.custo)}</td><td className="val-venda">{brl(p.venda)}</td>
          <td><span className="val-green">{mg}%</span></td>
          <td style={{fontWeight:700}}>{fmt(p.estoque)} <span style={{fontSize:11,color:'var(--gray-400)',fontWeight:400}}>{p.unidade_consumo}</span></td>
          <td><span className={`badge ${s.cls}`}>{s.txt}</span></td>
          <td><button className="btn-del" onClick={()=>remover(p.id,p.nome)}>Remover</button></td>
        </tr>);})}
        </tbody>
      </table></div>}
    </div>
    {modal&&<Modal title="Cadastrar Produto" onClose={()=>setModal(false)}>
      {err&&<div className="alert alert-err">{err}</div>}
      <div className="form-grid">
        <div className="form-group full"><label className="form-label">Nome *</label><input value={form.nome} onChange={e=>setForm(f=>({...f,nome:e.target.value}))} placeholder="Ex: Massa de polir 3M"/></div>
        <div className="form-group"><label className="form-label">Categoria</label><select value={form.categoria} onChange={e=>setForm(f=>({...f,categoria:e.target.value}))}>{CATS.map(c=><option key={c}>{c}</option>)}</select></div>
        <div className="form-group"><label className="form-label">Unidade de compra</label><select value={form.unidade_compra} onChange={e=>setForm(f=>({...f,unidade_compra:e.target.value,unidade_consumo:e.target.value,fator:'1'}))}>{['pç','lata','L','ml','kg','g','rolo','caixa','m','par','frasco','galão'].map(u=><option key={u}>{u}</option>)}</select></div>
        <div className="form-group"><label className="form-label">Unidade de consumo</label><select value={form.unidade_consumo||form.unidade_compra} onChange={e=>setForm(f=>({...f,unidade_consumo:e.target.value}))}>{['pç','lata','L','ml','kg','g','rolo','caixa','m','par','frasco','galão'].map(u=><option key={u}>{u}</option>)}</select></div>
        <div className="form-group full"><label className="form-label">Fator de conversão (1 {form.unidade_compra} = quantas {form.unidade_consumo}?)</label>
          <input type="number" min="0.001" step="any" value={form.fator} onChange={e=>setForm(f=>({...f,fator:e.target.value}))} placeholder="1"/>
          {form.unidade_compra!==form.unidade_consumo&&parseFloat(form.fator)>1&&<div className="hint" style={{color:'var(--green)',fontWeight:500}}>✓ 1 {form.unidade_compra} = {form.fator} {form.unidade_consumo}</div>}
        </div>
        <div className="form-group"><label className="form-label">💰 Custo (R$) *</label><input type="number" min="0" step="0.01" value={form.custo} onChange={e=>setForm(f=>({...f,custo:e.target.value}))} placeholder="0,00"/></div>
        <div className="form-group"><label className="form-label">🏷️ Venda (R$) *</label><input type="number" min="0" step="0.01" value={form.venda} onChange={e=>setForm(f=>({...f,venda:e.target.value}))} placeholder="0,00"/></div>
        {form.custo&&form.venda&&parseFloat(form.venda)>0&&<div className="form-group full"><div style={{background:'#e6f7ec',border:'1px solid #a8d5b5',borderRadius:8,padding:'10px 14px',fontSize:13}}>Margem: <strong style={{color:'var(--green)'}}>{Math.round(((parseFloat(form.venda)-parseFloat(form.custo))/parseFloat(form.venda))*100)}%</strong></div></div>}
        <div className="form-group"><label className="form-label">Qtd inicial</label><input type="number" min="0" value={form.estoque} onChange={e=>setForm(f=>({...f,estoque:e.target.value}))} placeholder="0"/></div>
        <div className="form-group"><label className="form-label">Estoque mínimo</label><input type="number" min="0" value={form.estoque_minimo} onChange={e=>setForm(f=>({...f,estoque_minimo:e.target.value}))} placeholder="0"/></div>
      </div>
      <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:8}}>
        <button className="btn btn-ghost" onClick={()=>setModal(false)}>Cancelar</button>
        <button className="btn btn-primary" onClick={salvar} disabled={loading}>{loading&&<span className="spinner"/>}Salvar</button>
      </div>
    </Modal>}
  </div>);
}

// ── ENTRADAS ──────────────────────────────────────────────────
function PgEntradas({dados,usuario,onRefresh,prodIdInicial,onProdIdInicialUsado}){
  const{produtos,entradas}=dados;
  const[modal,setModal]=useState(false);
  const[form,setForm]=useState({prodId:'',qtd:'',data:hoje,obs:''});
  const[err,setErr]=useState('');
  const[loading,setLoading]=useState(false);
  const[dataIni,setDataIni]=useState(primeiroDiaMes);
  const[dataFim,setDataFim]=useState(hoje);
  const[ap,setAp]=useState({ini:primeiroDiaMes,fim:hoje});

  useEffect(()=>{
    if(prodIdInicial){setForm(f=>({...f,prodId:prodIdInicial}));setModal(true);onProdIdInicialUsado&&onProdIdInicialUsado();}
  },[prodIdInicial]);

  const ativo=ap.ini!==primeiroDiaMes||ap.fim!==hoje;
  const lista=useMemo(()=>entradas.filter(e=>e.data>=ap.ini&&e.data<=ap.fim),[entradas,ap]);
  const totQtd=lista.reduce((s,e)=>s+e.qtd_compra,0);
  const totInv=lista.reduce((s,e)=>s+(e.custo||0)*e.qtd_consumo,0);

  const salvar=async()=>{
    const prod=produtos.find(p=>p.id===form.prodId);
    if(!prod){setErr('Selecione um produto.');return;}
    const qtd=parseFloat(form.qtd);if(!qtd||qtd<=0){setErr('Informe a quantidade.');return;}
    if(form.data>hoje){setErr('Data no futuro.');return;}
    setLoading(true);setErr('');
    const fatorP=prod.fator||1;
    const qtdConvertida=Math.round(qtd*fatorP);
    const{error}=await sb.from('entradas').insert({
      produto_id:prod.id,produto_nome:prod.nome,
      qtd_compra:qtd,unidade_compra:prod.unidade_compra,
      qtd_consumo:qtdConvertida,unidade_consumo:prod.unidade_consumo||prod.unidade_compra,
      fator:fatorP,custo:prod.custo,data:form.data,observacao:form.obs,
      registrado_por_id:usuario.id,registrado_por_nome:usuario.nome
    });
    if(error){setErr('Erro: '+error.message);setLoading(false);return;}
    await sb.from('produtos').update({estoque:prod.estoque+qtdConvertida}).eq('id',prod.id);
    await registrarLog(usuario,'Entrada registrada',`${qtd} ${prod.unidade_compra} de ${prod.nome}`);
    setModal(false);setForm({prodId:'',qtd:'',data:hoje,obs:''});
    onRefresh();setLoading(false);
  };

  const excluir=async e=>{
    if(!window.confirm(`Excluir entrada de ${e.qtd_compra}x ${e.produto_nome}?\nO estoque será subtraído.`))return;
    const prod=dados.produtos.find(p=>p.id===e.produto_id);
    await sb.from('entradas').update({deletado:true,deletado_em:new Date().toISOString()}).eq('id',e.id);
    if(prod)await sb.from('produtos').update({estoque:Math.max(0,prod.estoque-e.qtd_consumo)}).eq('id',prod.id);
    await registrarLog(usuario,'Entrada excluída',`${e.qtd_compra}x ${e.produto_nome}`);
    onRefresh();
  };

  return(<div>
    <div className="stat-row">
      <div className="stat"><div className="stat-label">Entradas no período</div><div className="stat-value">{lista.length}</div><div className="stat-sub">{ativo?'filtrado':'mês atual'}</div></div>
      <div className="stat"><div className="stat-label">Total de itens</div><div className="stat-value">{fmt(totQtd)}</div></div>
      <div className="stat"><div className="stat-label">Total investido</div><div className="stat-value" style={{fontSize:'clamp(12px,2vw,17px)'}}>{brl(totInv)}</div></div>
      <div className="stat"><div className="stat-label">Último recebimento</div><div className="stat-value" style={{fontSize:'clamp(11px,1.8vw,15px)'}}>{entradas[0]?.data||'—'}</div></div>
    </div>
    <div className="alert alert-info" style={{marginBottom:10}}>💡 Para corrigir uma entrada errada clique em <strong>Excluir</strong> — o estoque é ajustado automaticamente.</div>
    <FilterBar dataIni={dataIni} setDataIni={setDataIni} dataFim={dataFim} setDataFim={setDataFim} onFiltrar={()=>setAp({ini:dataIni,fim:dataFim})} onLimpar={()=>{setDataIni(primeiroDiaMes);setDataFim(hoje);setAp({ini:primeiroDiaMes,fim:hoje});}} ativo={ativo} count={lista.length}/>
    <div className="card">
      <div className="card-header"><span className="card-header-title">Histórico de entradas{ativo?' (filtrado)':''}</span><button className="btn btn-primary btn-sm" onClick={()=>setModal(true)}>+ Registrar entrada</button></div>
      {lista.length===0?<div className="empty">Nenhuma entrada no período.</div>:
      <div className="tbl-wrap"><table>
        <thead><tr><th>Data</th><th>Produto</th><th>Qtd</th><th>Custo unit.</th><th>Total pago</th><th>Observação</th><th>Por</th><th></th></tr></thead>
        <tbody>
          {lista.map(e=><tr key={e.id}>
            <td style={{color:'var(--gray-400)',whiteSpace:'nowrap'}}>{e.data}</td>
            <td style={{fontWeight:600}}>{e.produto_nome}</td>
            <td><span style={{color:'var(--green)',fontWeight:700}}>+{fmt(e.qtd_compra)} {e.unidade_compra}</span>{e.fator&&e.fator!==1&&<span style={{color:'var(--gray-400)',fontSize:11,display:'block'}}>= {fmt(e.qtd_consumo)} {e.unidade_consumo}</span>}</td>
            <td className="val-custo">{brl(e.custo||0)}</td>
            <td style={{fontWeight:600,color:'var(--brand)'}}>{brl((e.custo||0)*e.qtd_consumo)}</td>
            <td style={{color:'var(--gray-400)'}}>{e.observacao||'—'}</td>
            <td style={{color:'var(--gray-400)',fontSize:11}}>{e.registrado_por_nome||'—'}</td>
            <td><button className="btn-del" onClick={()=>excluir(e)}>Excluir</button></td>
          </tr>)}
          {lista.length>1&&<tr className="total-row"><td colSpan={2}>Total do período</td><td>+{fmt(totQtd)}</td><td/><td>{brl(totInv)}</td><td colSpan={3}/></tr>}
        </tbody>
      </table></div>}
    </div>
    {modal&&<Modal title="Registrar Entrada" onClose={()=>setModal(false)}>
      {err&&<div className="alert alert-err">{err}</div>}
      <div className="form-group"><label className="form-label">Produto *</label>
        <select value={form.prodId} onChange={e=>setForm(f=>({...f,prodId:e.target.value}))}>
          <option value="">Selecione...</option>{produtos.map(p=><option key={p.id} value={p.id}>{p.nome} — estoque: {fmt(p.estoque)} {p.unidade_consumo}</option>)}
        </select>
      </div>
      {(()=>{const pp=produtos.find(p=>p.id===form.prodId);const f2=pp?.fator||1;const qtdN=parseFloat(form.qtd)||0;return(<>
        <div className="form-group">
          <label className="form-label">Quantidade recebida{pp?` (em ${pp.unidade_compra})`:' *'}</label>
          <input type="number" min="0" step="any" value={form.qtd} onChange={e=>setForm(f=>({...f,qtd:e.target.value}))} placeholder="0"/>
          {pp&&pp.fator&&pp.fator!==1&&qtdN>0&&<div className="hint" style={{color:'var(--green)',fontWeight:500}}>✓ {qtdN} {pp.unidade_compra} = <strong>{Math.round(qtdN*f2)} {pp.unidade_consumo}</strong> no estoque</div>}
        </div>
        {pp&&qtdN>0&&<div style={{background:'var(--brand-light)',border:'1px solid var(--brand-border)',borderRadius:8,padding:'10px 14px',fontSize:13,marginBottom:14}}>
          Total a pagar: <strong style={{color:'var(--brand)'}}>{brl((pp.custo||0)*qtdN)}</strong>
        </div>}
      </>);})()}
      <div className="form-group"><label className="form-label">Data</label><input type="date" value={form.data} onChange={e=>setForm(f=>({...f,data:e.target.value}))}/></div>
      <div className="form-group"><label className="form-label">Observação (NF, fornecedor...)</label><input value={form.obs} onChange={e=>setForm(f=>({...f,obs:e.target.value}))} placeholder="Ex: NF 1023 – Fornecedor ABC"/></div>
      <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:8}}>
        <button className="btn btn-ghost" onClick={()=>setModal(false)}>Cancelar</button>
        <button className="btn btn-primary" onClick={salvar} disabled={loading}>{loading&&<span className="spinner"/>}Confirmar entrada</button>
      </div>
    </Modal>}
  </div>);
}

// ── CONSUMO ───────────────────────────────────────────────────
function PgConsumo({dados,usuario,onRefresh}){
  const{produtos,funcionarios,consumos}=dados;
  const[modal,setModal]=useState(false);
  const[form,setForm]=useState({funcId:'',prodId:'',qtd:'',data:hoje});
  const[err,setErr]=useState('');
  const[loading,setLoading]=useState(false);
  const[filFunc,setFilFunc]=useState('');
  const[dataIni,setDataIni]=useState(primeiroDiaMes);
  const[dataFim,setDataFim]=useState(hoje);
  const[ap,setAp]=useState({func:'',ini:primeiroDiaMes,fim:hoje});
  const ativo=ap.func||ap.ini!==primeiroDiaMes||ap.fim!==hoje;
  const lista=useMemo(()=>consumos.filter(c=>{
    if(ap.func&&c.funcionario_id!==ap.func)return false;
    return c.data>=ap.ini&&c.data<=ap.fim;
  }),[consumos,ap]);
  const prod=produtos.find(p=>p.id===form.prodId);
  const qtdN=parseFloat(form.qtd)||0;

  const salvar=async()=>{
    const func=funcionarios.find(f=>f.id===form.funcId);
    if(!func){setErr('Selecione o funcionário.');return;}
    if(!prod){setErr('Selecione o produto.');return;}
    if(!qtdN||qtdN<=0){setErr('Informe a quantidade.');return;}
    if(prod.estoque<qtdN){setErr(`Estoque insuficiente. Disponível: ${prod.estoque} ${prod.unidade_consumo}`);return;}
    if(form.data>hoje){setErr('Data no futuro.');return;}
    setLoading(true);setErr('');
    const custoUnit=prod.custo/(prod.fator||1);
    const vendaUnit=prod.venda/(prod.fator||1);
    const{error}=await sb.from('consumos').insert({
      produto_id:prod.id,produto_nome:prod.nome,
      funcionario_id:func.id,funcionario_nome:func.nome,
      qtd:qtdN,unidade:prod.unidade_consumo||prod.unidade_compra,
      custo:custoUnit,venda:vendaUnit,data:form.data,
      registrado_por_id:usuario.id,registrado_por_nome:usuario.nome
    });
    if(error){setErr('Erro: '+error.message);setLoading(false);return;}
    await sb.from('produtos').update({estoque:prod.estoque-qtdN}).eq('id',prod.id);
    await registrarLog(usuario,'Consumo registrado',`${qtdN} ${prod.unidade_consumo} de ${prod.nome} por ${func.nome}`);
    setModal(false);setForm({funcId:'',prodId:'',qtd:'',data:hoje});
    onRefresh();setLoading(false);
  };

  const excluir=async c=>{
    if(!window.confirm(`Excluir consumo de ${c.qtd}x ${c.produto_nome} de ${c.funcionario_nome}?\nO estoque será devolvido.`))return;
    await sb.from('consumos').update({deletado:true,deletado_em:new Date().toISOString()}).eq('id',c.id);
    const pp=dados.produtos.find(p=>p.id===c.produto_id);
    if(pp)await sb.from('produtos').update({estoque:pp.estoque+c.qtd}).eq('id',pp.id);
    await registrarLog(usuario,'Consumo excluído',`${c.qtd}x ${c.produto_nome} de ${c.funcionario_nome}`);
    onRefresh();
  };

  const totC=lista.reduce((s,c)=>s+(c.custo*c.qtd),0);
  const totV=lista.reduce((s,c)=>s+(c.venda*c.qtd),0);

  return(<div>
    <div className="alert alert-info" style={{marginBottom:10}}>💡 Para corrigir um lançamento errado clique em <strong>Excluir</strong> — o estoque é devolvido automaticamente.</div>
    <FilterBar funcionarios={funcionarios} filFunc={filFunc} setFilFunc={setFilFunc} dataIni={dataIni} setDataIni={setDataIni} dataFim={dataFim} setDataFim={setDataFim} onFiltrar={()=>setAp({func:filFunc,ini:dataIni,fim:dataFim})} onLimpar={()=>{setFilFunc('');setDataIni(primeiroDiaMes);setDataFim(hoje);setAp({func:'',ini:primeiroDiaMes,fim:hoje});}} ativo={ativo} count={lista.length}/>
    <div className="card">
      <div className="card-header"><span className="card-header-title">{lista.length} lançamento{lista.length!==1?'s':''}{ativo?' (filtrado)':''}</span><button className="btn btn-primary btn-sm" onClick={()=>setModal(true)}>+ Lançar consumo</button></div>
      {lista.length===0?<div className="empty">Nenhum consumo encontrado.</div>:
      <div className="tbl-wrap"><table>
        <thead><tr><th>Data</th><th>Funcionário</th><th>Produto</th><th>Qtd</th><th>Custo total</th><th>Valor venda</th><th>Por</th><th></th></tr></thead>
        <tbody>
          {lista.map(c=><tr key={c.id}>
            <td style={{color:'var(--gray-400)',whiteSpace:'nowrap'}}>{c.data}</td>
            <td><div style={{display:'flex',alignItems:'center',gap:8}}><div className="avatar" style={{width:26,height:26,fontSize:10}}>{initials(c.funcionario_nome)}</div><span style={{fontWeight:600}}>{c.funcionario_nome}</span></div></td>
            <td>{c.produto_nome}</td>
            <td style={{color:'var(--brand)',fontWeight:700}}>−{fmt(c.qtd)} {c.unidade||''}</td>
            <td className="val-custo">{brl(c.custo*c.qtd)}</td>
            <td className="val-venda">{brl(c.venda*c.qtd)}</td>
            <td style={{color:'var(--gray-400)',fontSize:11}}>{c.registrado_por_nome||'—'}</td>
            <td><button className="btn-del" onClick={()=>excluir(c)}>Excluir</button></td>
          </tr>)}
          <tr className="total-row"><td colSpan={4}>Total filtrado</td><td>{brl(totC)}</td><td>{brl(totV)}</td><td colSpan={2}/></tr>
        </tbody>
      </table></div>}
    </div>
    {modal&&<Modal title="Lançar Consumo" onClose={()=>setModal(false)}>
      {err&&<div className="alert alert-err">{err}</div>}
      <div className="form-group"><label className="form-label">Funcionário *</label>
        <select value={form.funcId} onChange={e=>setForm(f=>({...f,funcId:e.target.value}))}>
          <option value="">Selecione...</option>{funcionarios.map(f=><option key={f.id} value={f.id}>{f.nome} — {f.cargo}</option>)}
        </select>
      </div>
      <div className="form-group"><label className="form-label">Produto *</label>
        <select value={form.prodId} onChange={e=>setForm(f=>({...f,prodId:e.target.value}))}>
          <option value="">Selecione...</option>{produtos.filter(p=>p.estoque>0).map(p=><option key={p.id} value={p.id}>{p.nome} — {fmt(p.estoque)} {p.unidade_consumo} disponíveis</option>)}
        </select>
      </div>
      <div className="form-group">
        <label className="form-label">Quantidade retirada{prod?` (em ${prod.unidade_consumo||prod.unidade_compra})`:' *'}</label>
        <input type="number" min="0.001" step="any" value={form.qtd} onChange={e=>setForm(f=>({...f,qtd:e.target.value}))} placeholder="0"/>
        {prod&&<div className="hint">Disponível: {fmt(prod.estoque)} {prod.unidade_consumo}</div>}
      </div>
      {prod&&qtdN>0&&<div className="preview-box">
        <div className="preview-row"><span style={{color:'var(--gray-600)'}}>Custo do consumo</span><span className="val-custo" style={{fontWeight:600}}>{brl(prod.custo*qtdN)}</span></div>
        <div className="preview-row"><span style={{color:'var(--gray-600)'}}>Valor a cobrar no carro</span><span className="val-venda">{brl(prod.venda*qtdN)}</span></div>
      </div>}
      <div className="form-group"><label className="form-label">Data</label><input type="date" value={form.data} onChange={e=>setForm(f=>({...f,data:e.target.value}))}/></div>
      <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:8}}>
        <button className="btn btn-ghost" onClick={()=>setModal(false)}>Cancelar</button>
        <button className="btn btn-primary" onClick={salvar} disabled={loading}>{loading&&<span className="spinner"/>}Confirmar consumo</button>
      </div>
    </Modal>}
  </div>);
}

// ── RELATÓRIO (gerente) ───────────────────────────────────────
function PgRelatorio({dados}){
  const{funcionarios,consumos,entradas}=dados;
  const[filFunc,setFilFunc]=useState('');
  const[dataIni,setDataIni]=useState(primeiroDiaMes);
  const[dataFim,setDataFim]=useState(hoje);
  const[ap,setAp]=useState({func:'',ini:primeiroDiaMes,fim:hoje});
  const[expandido,setExpandido]=useState(null);
  const ativo=ap.func||ap.ini!==primeiroDiaMes||ap.fim!==hoje;

  const filtrados=useMemo(()=>consumos.filter(c=>{
    if(ap.func&&c.funcionario_id!==ap.func)return false;
    return c.data>=ap.ini&&c.data<=ap.fim;
  }),[consumos,ap]);

  const entradasP=useMemo(()=>entradas.filter(e=>e.data>=ap.ini&&e.data<=ap.fim),[entradas,ap]);
  const totC=filtrados.reduce((s,c)=>s+(c.custo*c.qtd),0);
  const totV=filtrados.reduce((s,c)=>s+(c.venda*c.qtd),0);

  const porFunc=funcionarios.map(f=>{
    const itens=filtrados.filter(c=>c.funcionario_id===f.id);
    return{...f,itens,custo:itens.reduce((s,c)=>s+(c.custo*c.qtd),0),venda:itens.reduce((s,c)=>s+(c.venda*c.qtd),0)};
  }).filter(f=>f.itens.length>0).sort((a,b)=>b.venda-a.venda);

  const exportarExcel=()=>{
    const wb=XLSX.utils.book_new();
    const r=[['RELATÓRIO — SILVERIO MULTIMARCAS'],[`Período: ${ap.ini} a ${ap.fim}`],[`Gerado em: ${new Date().toLocaleString('pt-BR')}`],[],
      ['CONSUMO'],['Custo total',totC],['Valor de venda',totV],['Margem',totV-totC]];
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),'Resumo');
    const fR=[['Funcionário','Cargo','Lançamentos','Custo (R$)','Venda (R$)','Margem (R$)']];
    porFunc.forEach(f=>fR.push([f.nome,f.cargo,f.itens.length,f.custo,f.venda,f.venda-f.custo]));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(fR),'Por Funcionário');
    const dR=[['Data','Funcionário','Produto','Qtd','Un','Custo Total','Venda Total']];
    filtrados.forEach(c=>dR.push([c.data,c.funcionario_nome,c.produto_nome,c.qtd,c.unidade||'',c.custo*c.qtd,c.venda*c.qtd]));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(dR),'Consumos');
    const eR=[['Data','Produto','Qtd Recebida','Custo Unit. (R$)','Total Pago (R$)','Observação']];
    entradasP.forEach(e=>eR.push([e.data,e.produto_nome,e.qtd_compra,e.custo||0,(e.custo||0)*e.qtd_consumo,e.observacao||'']));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(eR),'Entradas');
    XLSX.writeFile(wb,`Silverio_Relatorio_${ap.ini}_${ap.fim}.xlsx`);
  };

  return(<div>
    <FilterBar funcionarios={funcionarios} filFunc={filFunc} setFilFunc={setFilFunc} dataIni={dataIni} setDataIni={setDataIni} dataFim={dataFim} setDataFim={setDataFim} onFiltrar={()=>{setAp({func:filFunc,ini:dataIni,fim:dataFim});setExpandido(null);}} onLimpar={()=>{setFilFunc('');setDataIni(primeiroDiaMes);setDataFim(hoje);setAp({func:'',ini:primeiroDiaMes,fim:hoje});setExpandido(null);}} ativo={ativo} count={filtrados.length}/>
    <div className="stat-row">
      <div className="stat"><div className="stat-label">Custo total</div><div className="stat-value" style={{fontSize:'clamp(12px,2vw,17px)',color:'var(--gray-600)'}}>{brl(totC)}</div></div>
      <div className="stat"><div className="stat-label">Valor de venda</div><div className="stat-value" style={{fontSize:'clamp(12px,2vw,17px)',color:'var(--brand)'}}>{brl(totV)}</div></div>
      <div className="stat"><div className="stat-label">Margem bruta</div><div className="stat-value" style={{fontSize:'clamp(12px,2vw,17px)',color:'var(--green)'}}>{brl(totV-totC)}</div><div className="stat-sub">{totV>0?Math.round(((totV-totC)/totV)*100):0}%</div></div>
      <div className="stat"><div className="stat-label">Entradas no período</div><div className="stat-value">{entradasP.length}</div></div>
    </div>
    <div style={{display:'flex',justifyContent:'flex-end',marginBottom:14}}>
      <button className="btn btn-success" onClick={exportarExcel}>📥 Exportar Excel</button>
    </div>
    <div className="card card-inner">
      <div className="card-title">Consumo por funcionário</div>
      {porFunc.length===0&&<div style={{color:'var(--gray-400)',fontSize:13}}>Nenhum lançamento encontrado.</div>}
      {porFunc.map(f=>(
        <div key={f.id} className={`func-card ${expandido===f.id?'expanded':''}`} onClick={()=>setExpandido(expandido===f.id?null:f.id)}>
          <div style={{display:'flex',alignItems:'center',gap:10,justifyContent:'space-between'}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}><div className="avatar">{initials(f.nome)}</div>
              <div><div style={{fontWeight:700,fontSize:14}}>{f.nome}</div><div style={{fontSize:11,color:'var(--gray-400)'}}>{f.cargo} · {f.itens.length} lançamento{f.itens.length>1?'s':''}</div></div>
            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              <div style={{fontSize:10,color:'var(--gray-400)'}}>Custo / Venda</div>
              <div style={{fontSize:13}}><span className="val-custo">{brl(f.custo)}</span> · <span className="val-venda">{brl(f.venda)}</span></div>
            </div>
            <span style={{color:'var(--gray-400)',fontSize:13,flexShrink:0}}>{expandido===f.id?'▲':'▼'}</span>
          </div>
          {expandido===f.id&&<div style={{marginTop:12,borderTop:'1px solid var(--brand-border)',paddingTop:12}}>
            <div className="tbl-wrap"><table>
              <thead><tr><th>Produto</th><th>Data</th><th>Qtd</th><th>Custo</th><th>Venda</th></tr></thead>
              <tbody>
                {f.itens.map(c=><tr key={c.id}><td>{c.produto_nome}</td><td style={{color:'var(--gray-400)',whiteSpace:'nowrap'}}>{c.data}</td><td>{fmt(c.qtd)} {c.unidade}</td><td className="val-custo">{brl(c.custo*c.qtd)}</td><td className="val-venda">{brl(c.venda*c.qtd)}</td></tr>)}
                <tr className="total-row"><td colSpan={3}>Total</td><td>{brl(f.custo)}</td><td>{brl(f.venda)}</td></tr>
              </tbody>
            </table></div>
          </div>}
        </div>
      ))}
      {porFunc.length>0&&<div style={{background:'var(--brand-light)',border:'1px solid var(--brand-border)',borderRadius:10,padding:'12px 16px',marginTop:6,display:'flex',justifyContent:'space-between',fontWeight:700,fontSize:14}}><span>Total geral</span><span className="val-venda">{brl(totV)}</span></div>}
    </div>
  </div>);
}

// ── FUNCIONÁRIOS ──────────────────────────────────────────────
function PgFuncionarios({dados,usuario,onRefresh,setPage}){
  const{funcionarios,cargos,consumos}=dados;
  const[modal,setModal]=useState(false);
  const[form,setForm]=useState({nome:'',cargo:''});
  const[err,setErr]=useState('');
  const[loading,setLoading]=useState(false);

  const salvar=async()=>{
    if(!form.nome.trim()){setErr('Informe o nome.');return;}
    if(!form.cargo){setErr('Selecione um cargo.');return;}
    setLoading(true);setErr('');
    const{error}=await sb.from('funcionarios').insert({nome:form.nome.trim(),cargo:form.cargo});
    if(error){setErr('Erro: '+error.message);setLoading(false);return;}
    await registrarLog(usuario,'Funcionário cadastrado',form.nome.trim());
    setModal(false);setForm({nome:'',cargo:''});onRefresh();setLoading(false);
  };

  const remover=async(id,nome)=>{
    const temConsumo=consumos.some(c=>c.funcionario_id===id);
    if(temConsumo){alert(`Não é possível remover "${nome}".\nPossui consumos registrados.`);return;}
    if(!window.confirm(`Remover "${nome}"?`))return;
    await sb.from('funcionarios').delete().eq('id',id);
    await registrarLog(usuario,'Funcionário removido',nome);
    onRefresh();
  };

  return(<div>
    {cargos.length===0&&<div className="alert alert-warn" style={{marginBottom:12}}>⚠️ Nenhum cargo cadastrado. <span style={{cursor:'pointer',textDecoration:'underline',fontWeight:600}} onClick={()=>setPage('cargos')}>Cadastrar cargos →</span></div>}
    <div className="card">
      <div className="card-header"><span className="card-header-title">{funcionarios.length} funcionário{funcionarios.length!==1?'s':''}</span><button className="btn btn-primary btn-sm" onClick={()=>setModal(true)}>+ Funcionário</button></div>
      {funcionarios.length===0?<div className="empty">Nenhum funcionário cadastrado.</div>:
      <div className="tbl-wrap"><table><thead><tr><th>Nome</th><th>Cargo</th><th>Total consumido (venda)</th><th></th></tr></thead>
      <tbody>{funcionarios.map(f=>{const total=consumos.filter(c=>c.funcionario_id===f.id).reduce((s,c)=>s+(c.venda*c.qtd),0);return(<tr key={f.id}>
        <td><div style={{display:'flex',alignItems:'center',gap:10}}><div className="avatar" style={{width:28,height:28,fontSize:10}}>{initials(f.nome)}</div><span style={{fontWeight:600}}>{f.nome}</span></div></td>
        <td><span className="tag">{f.cargo}</span></td>
        <td className="val-venda">{brl(total)}</td>
        <td><button className="btn-del" onClick={()=>remover(f.id,f.nome)}>Remover</button></td>
      </tr>);})}</tbody></table></div>}
    </div>
    {modal&&<Modal title="Novo Funcionário" onClose={()=>setModal(false)}>
      {err&&<div className="alert alert-err">{err}</div>}
      <div className="form-group"><label className="form-label">Nome completo *</label><input value={form.nome} onChange={e=>setForm(f=>({...f,nome:e.target.value}))} placeholder="Nome..."/></div>
      <div className="form-group"><label className="form-label">Cargo *</label>
        {cargos.length===0?<div className="alert alert-warn">Nenhum cargo. <span style={{cursor:'pointer',textDecoration:'underline'}} onClick={()=>{setModal(false);setPage('cargos');}}>Cadastrar →</span></div>
          :<><CargoBuscavel cargos={cargos.map(c=>c.nome)} value={form.cargo} onChange={v=>setForm(f=>({...f,cargo:v}))}/><div className="hint">Digite para filtrar</div></>}
      </div>
      <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:8}}>
        <button className="btn btn-ghost" onClick={()=>setModal(false)}>Cancelar</button>
        <button className="btn btn-primary" onClick={salvar} disabled={loading}>{loading&&<span className="spinner"/>}Salvar</button>
      </div>
    </Modal>}
  </div>);
}

// ── CARGOS ────────────────────────────────────────────────────
function PgCargos({dados,usuario,onRefresh}){
  const{cargos,funcionarios}=dados;
  const[novo,setNovo]=useState('');
  const[err,setErr]=useState('');
  const[loading,setLoading]=useState(false);

  const add=async()=>{
    const c=novo.trim();
    if(!c){setErr('Digite o nome.');return;}
    if(cargos.some(x=>x.nome.toLowerCase()===c.toLowerCase())){setErr('Cargo já existe.');return;}
    setLoading(true);setErr('');
    await sb.from('cargos').insert({nome:c});
    await registrarLog(usuario,'Cargo adicionado',c);
    setNovo('');onRefresh();setLoading(false);
  };

  const rem=async cargo=>{
    if(funcionarios.some(f=>f.cargo===cargo.nome)){alert(`O cargo "${cargo.nome}" está em uso.`);return;}
    if(window.confirm(`Remover "${cargo.nome}"?`)){
      await sb.from('cargos').delete().eq('id',cargo.id);
      await registrarLog(usuario,'Cargo removido',cargo.nome);
      onRefresh();
    }
  };

  return(<div>
    <div className="card card-inner"><div className="card-title">Cadastrar novo cargo</div>
      <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
        <div style={{flex:1,minWidth:180}}><input value={novo} onChange={e=>{setNovo(e.target.value);setErr('');}} onKeyDown={e=>e.key==='Enter'&&add()} placeholder="Ex: Inspetor, Lanterneiro..."/>{err&&<div style={{fontSize:12,color:'var(--brand)',marginTop:5}}>{err}</div>}</div>
        <button className="btn btn-primary" onClick={add} disabled={loading}>{loading&&<span className="spinner"/>}+ Adicionar</button>
      </div>
    </div>
    <div className="card card-inner"><div className="card-title">{cargos.length} cargo{cargos.length!==1?'s':''}</div>
      {cargos.length===0?<div style={{color:'var(--gray-400)',fontSize:13,padding:'16px 0'}}>Nenhum cargo ainda.</div>:
      <div className="cargo-grid">{cargos.map(c=>{const n=funcionarios.filter(f=>f.cargo===c.nome).length;return(
        <div key={c.id} className="cargo-pill"><div><div style={{fontWeight:600}}>{c.nome}</div><div style={{fontSize:10,color:'var(--gray-400)',marginTop:2}}>{n} funcionário{n!==1?'s':''}</div></div><button onClick={()=>rem(c)}>×</button></div>
      );})}</div>}
    </div>
  </div>);
}

// ── USUÁRIOS (gerente) ────────────────────────────────────────
function PgUsuarios({dados,usuario,onRefresh}){
  const{usuarios}=dados;
  const[modal,setModal]=useState(false);
  const[form,setForm]=useState({nome:'',email:'',senha:'',perfil:'funcionario'});
  const[err,setErr]=useState('');
  const[loading,setLoading]=useState(false);

  const salvar=async()=>{
    if(!form.nome.trim()||!form.email.trim()||!form.senha.trim()){setErr('Preencha todos os campos.');return;}
    if(usuarios.some(u=>u.email===form.email.trim().toLowerCase())){setErr('Email já cadastrado.');return;}
    setLoading(true);setErr('');
    const{error}=await sb.from('usuarios').insert({nome:form.nome.trim(),email:form.email.trim().toLowerCase(),senha:form.senha,perfil:form.perfil});
    if(error){setErr('Erro: '+error.message);setLoading(false);return;}
    await registrarLog(usuario,'Usuário cadastrado',`${form.nome} (${form.perfil})`);
    setModal(false);setForm({nome:'',email:'',senha:'',perfil:'funcionario'});onRefresh();setLoading(false);
  };

  const toggleAtivo=async(u)=>{
    if(u.id===usuario.id){alert('Você não pode desativar seu próprio usuário.');return;}
    await sb.from('usuarios').update({ativo:!u.ativo}).eq('id',u.id);
    await registrarLog(usuario,u.ativo?'Usuário desativado':'Usuário ativado',u.nome);
    onRefresh();
  };

  return(<div>
    <div className="alert alert-info" style={{marginBottom:12}}>As senhas são armazenadas no banco. Oriente os usuários a não compartilhar suas senhas.</div>
    <div className="card">
      <div className="card-header"><span className="card-header-title">{usuarios.length} usuário{usuarios.length!==1?'s':('')} do sistema</span><button className="btn btn-primary btn-sm" onClick={()=>setModal(true)}>+ Usuário</button></div>
      <div className="tbl-wrap"><table><thead><tr><th>Nome</th><th>Email</th><th>Perfil</th><th>Status</th><th></th></tr></thead>
      <tbody>{usuarios.map(u=><tr key={u.id}>
        <td style={{fontWeight:600}}>{u.nome}{u.id===usuario.id&&<span style={{fontSize:10,background:'var(--brand-light)',color:'var(--brand)',borderRadius:4,padding:'1px 6px',marginLeft:6}}>você</span>}</td>
        <td style={{color:'var(--gray-400)'}}>{u.email}</td>
        <td><span className="tag">{u.perfil}</span></td>
        <td><span className={`badge ${u.ativo?'badge-ok':'badge-out'}`}>{u.ativo?'Ativo':'Inativo'}</span></td>
        <td><button className="btn-del" onClick={()=>toggleAtivo(u)}>{u.ativo?'Desativar':'Ativar'}</button></td>
      </tr>)}</tbody></table></div>
    </div>
    {modal&&<Modal title="Novo Usuário" onClose={()=>setModal(false)}>
      {err&&<div className="alert alert-err">{err}</div>}
      <div className="form-group"><label className="form-label">Nome *</label><input value={form.nome} onChange={e=>setForm(f=>({...f,nome:e.target.value}))} placeholder="Nome completo"/></div>
      <div className="form-group"><label className="form-label">Email *</label><input type="email" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))} placeholder="email@loja.com"/></div>
      <div className="form-group"><label className="form-label">Senha *</label><input type="password" value={form.senha} onChange={e=>setForm(f=>({...f,senha:e.target.value}))} placeholder="Mínimo 6 caracteres"/></div>
      <div className="form-group"><label className="form-label">Perfil</label>
        <select value={form.perfil} onChange={e=>setForm(f=>({...f,perfil:e.target.value}))}>
          <option value="funcionario">Funcionário</option>
          <option value="gerente">Gerente</option>
        </select>
      </div>
      <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:8}}>
        <button className="btn btn-ghost" onClick={()=>setModal(false)}>Cancelar</button>
        <button className="btn btn-primary" onClick={salvar} disabled={loading}>{loading&&<span className="spinner"/>}Salvar</button>
      </div>
    </Modal>}
  </div>);
}

// ── LOG (gerente) ─────────────────────────────────────────────
function PgLog({dados}){
  const{logs}=dados;
  return(<div>
    <div className="card">
      <div className="card-header"><span className="card-header-title">Log de ações ({logs.length} registros)</span></div>
      {logs.length===0?<div className="empty">Nenhuma ação registrada.</div>:
      <div className="tbl-wrap"><table>
        <thead><tr><th>Data/Hora</th><th>Usuário</th><th>Ação</th><th>Detalhes</th></tr></thead>
        <tbody>{logs.map(l=><tr key={l.id}>
          <td style={{color:'var(--gray-400)',whiteSpace:'nowrap',fontSize:11}}>{new Date(l.created_at).toLocaleString('pt-BR')}</td>
          <td style={{fontWeight:600}}>{l.usuario_nome}</td>
          <td><span className="tag">{l.acao}</span></td>
          <td style={{color:'var(--gray-600)',fontSize:12}}>{l.detalhes||'—'}</td>
        </tr>)}</tbody>
      </table></div>}
    </div>
  </div>);
}

// ── INVENTÁRIO ────────────────────────────────────────────────
function PgInventario({dados,usuario,onRefresh}){
  const{produtos}=dados;
  const[contagem,setContagem]=useState({});
  const[obs,setObs]=useState('');
  const[busca,setBusca]=useState('');
  const[loading,setLoading]=useState(false);
  const[salvo,setSalvo]=useState(false);

  const produtosFiltrados=useMemo(()=>{
    if(!busca.trim())return produtos;
    const b=busca.toLowerCase();
    return produtos.filter(p=>p.nome.toLowerCase().includes(b)||p.categoria.toLowerCase().includes(b));
  },[produtos,busca]);

  const diferencas=useMemo(()=>produtos.map(p=>{
    const contado=contagem[p.id];
    if(contado===undefined||contado==='')return{...p,contado:null,diff:null};
    const c=parseInt(contado);
    return{...p,contado:c,diff:c-p.estoque};
  }),[produtos,contagem]);

  const diferencasFiltradas=useMemo(()=>produtosFiltrados.map(p=>{
    const contado=contagem[p.id];
    if(contado===undefined||contado==='')return{...p,contado:null,diff:null};
    const c=parseInt(contado);
    return{...p,contado:c,diff:c-p.estoque};
  }),[produtosFiltrados,contagem]);

  const comDiff=diferencas.filter(p=>p.diff!==null&&p.diff!==0);
  const naoContado=diferencas.filter(p=>p.diff===null);

  const confirmarAjuste=async()=>{
    if(comDiff.length===0){alert('Nenhuma diferença encontrada.');return;}
    if(!window.confirm(`Confirmar ajuste de ${comDiff.length} produto(s)?`))return;
    setLoading(true);
    for(const p of comDiff){
      await sb.from('produtos').update({estoque:p.contado}).eq('id',p.id);
      await registrarLog(usuario,'Ajuste de inventário',`${p.nome}: ${p.estoque} → ${p.contado} (${p.diff>0?'+':''}${p.diff}) ${obs?'| '+obs:''}`);
    }
    setContagem({});setObs('');setSalvo(true);
    setTimeout(()=>setSalvo(false),3000);
    onRefresh();setLoading(false);
  };

  return(<div>
    {salvo&&<div className="alert alert-success" style={{marginBottom:12}}>✅ Ajuste aplicado com sucesso!</div>}
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,minmax(0,1fr))',gap:12,marginBottom:16}}>
      <div className="stat"><div className="stat-label">Total de produtos</div><div className="stat-value">{produtos.length}</div></div>
      <div className="stat"><div className="stat-label">Já contados</div><div className="stat-value" style={{color:'var(--green)'}}>{diferencas.filter(p=>p.diff!==null).length}</div></div>
      <div className="stat"><div className="stat-label">Com diferença</div><div className="stat-value" style={{color:comDiff.length>0?'var(--brand)':'var(--green)'}}>{comDiff.length}</div></div>
    </div>
    <div className="alert alert-info" style={{marginBottom:12}}>📋 <strong>Como usar:</strong> Digite a quantidade física contada ao lado de cada produto. Ao final, clique em <strong>Confirmar ajuste</strong>.</div>
    <div className="card" style={{padding:0}}>
      <div className="card-header" style={{flexWrap:'wrap',gap:8}}>
        <div style={{display:'flex',alignItems:'center',gap:8,flex:1,minWidth:200}}>
          <input placeholder="🔍  Buscar produto..." value={busca} onChange={e=>setBusca(e.target.value)} style={{flex:1,background:'var(--gray-50)',border:'1.5px solid var(--border)',borderRadius:'8px',padding:'7px 12px',fontSize:'14px',outline:'none'}}/>
          {busca&&<button onClick={()=>setBusca('')} style={{background:'none',border:'none',cursor:'pointer',color:'var(--gray-400)',fontSize:18,lineHeight:1,padding:'0 4px'}}>×</button>}
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {Object.keys(contagem).length>0&&<button className="btn btn-ghost btn-sm" onClick={()=>{if(window.confirm('Limpar contagem?')){setContagem({});setObs('')}}}>🗑️ Limpar</button>}
          {comDiff.length>0&&<button className="btn btn-primary btn-sm" onClick={confirmarAjuste} disabled={loading}>{loading&&<span className="spinner"/>}✅ Confirmar ({comDiff.length})</button>}
        </div>
      </div>
      {Object.keys(contagem).length>0&&<div style={{padding:'10px 16px',borderBottom:'1px solid var(--gray-100)',display:'flex',alignItems:'center',gap:10}}>
        <label className="form-label" style={{margin:0,whiteSpace:'nowrap'}}>Observação:</label>
        <input value={obs} onChange={e=>setObs(e.target.value)} placeholder="Ex: Inventário mensal de abril..." style={{flex:1,padding:'6px 10px',fontSize:14,height:34}}/>
      </div>}
      <div className="tbl-wrap"><table>
        <thead><tr><th>Produto</th><th>Categoria</th><th>Estoque sistema</th><th>Contagem física</th><th>Diferença</th></tr></thead>
        <tbody>
          {diferencasFiltradas.length===0
            ?<tr><td colSpan={5} style={{textAlign:'center',padding:'32px',color:'var(--gray-400)'}}>Nenhum produto encontrado.</td></tr>
            :diferencasFiltradas.map(p=>{
            const diffColor=p.diff===null?'transparent':p.diff>0?'var(--green)':p.diff<0?'var(--brand)':'var(--gray-400)';
            return(<tr key={p.id} style={{background:p.diff!==null&&p.diff!==0?'#fffbf0':''}}>
              <td style={{fontWeight:600}}>{p.nome}</td>
              <td><span className="tag">{p.categoria}</span></td>
              <td style={{fontWeight:700,fontSize:15}}>{fmt(p.estoque)} <span style={{fontSize:11,color:'var(--gray-400)',fontWeight:400}}>{p.unidade_consumo}</span></td>
              <td><input type="number" min="0" value={contagem[p.id]??''} onChange={e=>setContagem(c=>({...c,[p.id]:e.target.value}))} placeholder="—" step="any" style={{width:90,padding:'6px 10px',fontSize:15,fontWeight:600,textAlign:'center',border:'1.5px solid var(--border)',borderRadius:7,height:36}}/></td>
              <td>{p.diff===null?<span style={{color:'var(--gray-400)'}}>—</span>:p.diff===0?<span style={{color:'var(--green)',fontWeight:600}}>✓ OK</span>:<span style={{color:diffColor,fontWeight:700,fontSize:14}}>{p.diff>0?`+${p.diff}`:p.diff}</span>}</td>
            </tr>);
          })}
        </tbody>
      </table></div>
      {Object.keys(contagem).length>0&&naoContado.length>0&&<div style={{padding:'12px 16px',borderTop:'1px solid #ffd54f',background:'#fff8e1',display:'flex',alignItems:'flex-start',gap:10}}>
        <span style={{fontSize:18,flexShrink:0}}>⚠️</span>
        <div><div style={{fontSize:13,fontWeight:600,color:'#7a5c00',marginBottom:4}}>{naoContado.length} produto{naoContado.length>1?'s':''} não contado{naoContado.length>1?'s':''}:</div>
        <div style={{fontSize:12,color:'#7a5c00'}}>{naoContado.slice(0,5).map(p=>p.nome).join(', ')}{naoContado.length>5?` e mais ${naoContado.length-5}...`:''}</div></div>
      </div>}
    </div>
  </div>);
}

// ── APP PRINCIPAL ─────────────────────────────────────────────
const PAGES_FUNC=[
  {id:'dashboard',icon:'🏠',label:'Dashboard',sec:'op'},
  {id:'estoque',icon:'📦',label:'Estoque',sec:'op'},
  {id:'entradas',icon:'📥',label:'Entradas',sec:'op'},
  {id:'consumo',icon:'✏️',label:'Lançar Consumo',sec:'op'},
  {id:'inventario',icon:'🔢',label:'Inventário',sec:'op'},
  {id:'funcionarios',icon:'👷',label:'Funcionários',sec:'eq'},
  {id:'cargos',icon:'🏷️',label:'Cargos',sec:'eq'},
];
const PAGES_GERENTE=[
  ...PAGES_FUNC,
  {id:'relatorio',icon:'📊',label:'Relatório',sec:'ger'},
  {id:'log',icon:'📋',label:'Log de Ações',sec:'ger'},
  {id:'usuarios',icon:'👤',label:'Usuários',sec:'ger'},
];
const TITLES={dashboard:'Dashboard',estoque:'Estoque',entradas:'Entradas',consumo:'Lançar Consumo',relatorio:'Relatório',inventario:'Inventário',funcionarios:'Funcionários',cargos:'Cargos',log:'Log de Ações',usuarios:'Usuários do Sistema'};

function AppLogado({usuario,onLogout}){
  const[page,setPage]=useState('dashboard');
  const[entradaProdId,setEntradaProdId]=useState(null);
  const[sideOpen,setSideOpen]=useState(false);
  const[dados,setDados]=useState({produtos:[],entradas:[],consumos:[],funcionarios:[],cargos:[],logs:[],usuarios:[]});
  const[carregando,setCarregando]=useState(true);

  const isGerente=usuario.perfil==='gerente';
  const PAGES=isGerente?PAGES_GERENTE:PAGES_FUNC;

  const carregar=useCallback(async()=>{
    setCarregando(true);
    const[p,e,c,f,ca,l,u]=await Promise.all([
      sb.from('produtos').select('*').eq('ativo',true).order('nome'),
      sb.from('entradas').select('*').eq('deletado',false).order('data',{ascending:false}),
      sb.from('consumos').select('*').eq('deletado',false).order('data',{ascending:false}),
      sb.from('funcionarios').select('*').eq('ativo',true).order('nome'),
      sb.from('cargos').select('*').order('nome'),
      isGerente?sb.from('log_acoes').select('*').order('created_at',{ascending:false}).limit(500):{data:[]},
      isGerente?sb.from('usuarios').select('*').order('nome'):{data:[]},
    ]);
    setDados({
      produtos:p.data||[],
      entradas:e.data||[],
      consumos:c.data||[],
      funcionarios:f.data||[],
      cargos:ca.data||[],
      logs:l.data||[],
      usuarios:u.data||[],
    });
    setCarregando(false);
  },[isGerente]);

  useEffect(()=>{carregar();},[carregar]);

  const criticos=(dados.produtos||[]).filter(p=>p.estoque<=p.estoque_minimo).length;
  const navTo=id=>{setPage(id);setSideOpen(false);};

  const secs={op:'Operação',eq:'Equipe',ger:'Gerência'};
  const secOrder=['op','eq','ger'];

  return(<div className="app">
    {sideOpen&&<div className="sidebar-overlay open" onClick={()=>setSideOpen(false)}/>}
    <div className={`sidebar ${sideOpen?'open':''}`}>
      <div className="sidebar-logo">
        <img src={LOGO} alt="Silvério" onError={e=>{e.target.style.display='none';}}/>
        <div className="logo-sub">Controle de Estoque</div>
      </div>
      <div className="nav">
        {secOrder.map(sec=>{
          const itens=PAGES.filter(p=>p.sec===sec);
          if(itens.length===0)return null;
          return(<React.Fragment key={sec}>
            <div className="nav-sec">{secs[sec]}</div>
            {itens.map(p=>(
              <button key={p.id} className={`nav-btn ${page===p.id?'active':''}`} onClick={()=>navTo(p.id)}>
                <span className="nav-icon">{p.icon}</span><span>{p.label}</span>
                {p.id==='estoque'&&criticos>0&&<span className="nav-badge">{criticos}</span>}
              </button>
            ))}
          </React.Fragment>);
        })}
      </div>
      <div className="sidebar-footer">
        <div>{usuario.nome}</div>
        <div style={{fontSize:9,opacity:.7,textTransform:'capitalize'}}>{usuario.perfil}</div>
        <button onClick={onLogout}>Sair</button>
      </div>
    </div>
    <div className="main">
      <div className="topbar">
        <div className="topbar-left">
          <button className="ham" onClick={()=>setSideOpen(o=>!o)} aria-label="Menu"><span/><span/><span/></button>
          <span className="topbar-title">{TITLES[page]}</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          {carregando&&<span style={{fontSize:12,color:'var(--gray-400)'}}><span className="spinner" style={{width:14,height:14,borderWidth:2}}/>Atualizando...</span>}
          <span className="topbar-user">{MESES[mesAtual]} {anoAtual}</span>
          <button className="btn btn-ghost btn-sm" onClick={carregar} title="Atualizar dados">↻</button>
        </div>
      </div>
      <div className="content">
        {carregando&&dados.produtos.length===0?<div className="loading"><span className="spinner"/>Carregando dados...</div>:<>
          {page==='dashboard'&&<PgDashboard dados={dados}/>}
          {page==='estoque'&&<PgEstoque dados={dados} usuario={usuario} onRefresh={carregar} setPage={setPage} setEntradaProdId={setEntradaProdId}/>}
          {page==='entradas'&&<PgEntradas dados={dados} usuario={usuario} onRefresh={carregar} prodIdInicial={entradaProdId} onProdIdInicialUsado={()=>setEntradaProdId(null)}/>}
          {page==='consumo'&&<PgConsumo dados={dados} usuario={usuario} onRefresh={carregar}/>}
          {page==='inventario'&&<PgInventario dados={dados} usuario={usuario} onRefresh={carregar}/>}
          {page==='funcionarios'&&<PgFuncionarios dados={dados} usuario={usuario} onRefresh={carregar} setPage={setPage}/>}
          {page==='cargos'&&<PgCargos dados={dados} usuario={usuario} onRefresh={carregar}/>}
          {isGerente&&page==='relatorio'&&<PgRelatorio dados={dados}/>}
          {isGerente&&page==='log'&&<PgLog dados={dados}/>}
          {isGerente&&page==='usuarios'&&<PgUsuarios dados={dados} usuario={usuario} onRefresh={carregar}/>}
        </>}
      </div>
    </div>
  </div>);
}

function App(){
  const[usuario,setUsuario]=useState(()=>{
    try{return JSON.parse(localStorage.getItem('prepcarros_user'));}catch{return null;}
  });

  const login=u=>{setUsuario(u);};
  const logout=()=>{
    localStorage.removeItem('prepcarros_user');
    setUsuario(null);
  };

  if(!usuario)return <Login onLogin={login}/>;
  return <AppLogado usuario={usuario} onLogout={logout}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
